# Линт, типы, тесты (если есть), продакшен-сборка Next (без static export).
# Секреты не обязательны; при необходимости задайте NEXT_PUBLIC_* для успешного build.

name: CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        env:
          # Только для `prisma generate` (подключение к БД не выполняется)
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
        run: npm run prisma:generate

      - name: ESLint
        run: npm run lint

      - name: TypeScript
        run: npm run typecheck

      - name: Tests (if configured)
        run: npm run test --if-present

      - name: Production build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
          # При необходимости: secrets.NEXT_PUBLIC_SITE_URL
        run: npm run build
