# Линт, типы, тесты (если есть), продакшен-сборка Next (без static export).
# Секреты не обязательны; при необходимости задайте NEXT_PUBLIC_* для успешного build.

name: CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Align npm with lockfile
        run: npm i -g npm@11.16.0

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript
        run: npm run typecheck

      - name: Tests (if configured)
        run: npm run test --if-present

      - name: Production build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          # Заглушки: страницы dynamic, к Postgres при `next build` никто не подключается.
          PAYLOAD_SECRET: "ci-build-placeholder-secret-0123456789abcdef"
          DATABASE_URI: "postgres://ci:ci@localhost:5432/ci"
          # При необходимости: secrets.NEXT_PUBLIC_SITE_URL
        run: npm run build
