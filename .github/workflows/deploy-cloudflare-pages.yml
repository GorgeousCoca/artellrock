# Статический экспорт в Cloudflare Pages (тот же сценарий, что и GitHub Pages).
# Settings → Variables: DEPLOY_PLATFORM = cloudflare
# Settings → Secrets:
#   CLOUDFLARE_API_TOKEN — с правами «Account — Cloudflare Pages — Edit»
#   CLOUDFLARE_ACCOUNT_ID — из обзора аккаунта в дашборде
# Переменная репозитория (Variables):
#   CLOUDFLARE_PAGES_PROJECT — имя проекта в Pages (создайте заранее в CF)

name: Deploy Cloudflare Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: cloudflare-pages-deploy
  cancel-in-progress: true

jobs:
  publish:
    if: ${{ vars.DEPLOY_PLATFORM == 'cloudflare' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Require Cloudflare project variable
        env:
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        run: |
          if [ -z "$CLOUDFLARE_PAGES_PROJECT" ]; then
            echo "::error::Задайте repository variable CLOUDFLARE_PAGES_PROJECT"
            exit 1
          fi

      - name: Require CF_PAGES_SITE_URL
        env:
          CF_PAGES_SITE_URL: ${{ secrets.CF_PAGES_SITE_URL }}
        run: |
          if [ -z "$CF_PAGES_SITE_URL" ]; then
            echo "::error::Добавьте secret CF_PAGES_SITE_URL (канонический URL сайта)"
            exit 1
          fi

      - name: Prisma generate
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
        run: npm run prisma:generate

      - name: Remove server-only routes for static export
        run: |
          rm -rf src/app/api
          rm -rf src/app/admin
          rm -rf "src/app/(public)/portfolio/[slug]"

      - name: Build static export
        env:
          GITHUB_ACTIONS: "true"
          GITHUB_REPOSITORY: ${{ github.repository }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.CF_PAGES_SITE_URL }}
          NEXT_PUBLIC_STATIC_DEMO: "true"
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
        run: npm run build

      - name: Add .nojekyll
        run: touch out/.nojekyll

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }}
