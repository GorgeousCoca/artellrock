# Статический экспорт на GitHub Pages (см. next.config: GITHUB_ACTIONS=true).
#
# Выбор платформы: Settings → Variables → DEPLOY_PLATFORM
#   — не задано или `github-pages` → этот workflow деплоит на Pages
#   — `vercel` | `cloudflare` | `server` → см. deploy-vercel / deploy-cloudflare-pages / deploy-server
#
# Секреты/переменные (Actions → Secrets and variables):
#   Variables: DEPLOY_PLATFORM (опционально)
#   Secrets: нет обязательных для Pages (URL берётся из github.repository_owner)

name: Deploy to GitHub Pages

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  skip-notice:
    if: ${{ vars.DEPLOY_PLATFORM != '' && vars.DEPLOY_PLATFORM != 'github-pages' }}
    runs-on: ubuntu-latest
    steps:
      - name: Skip GitHub Pages
        run: |
          echo "DEPLOY_PLATFORM=${{ vars.DEPLOY_PLATFORM }} — деплой GitHub Pages отключён."
          echo "Чтобы снова включить Pages, очистите переменную или задайте github-pages."

  build:
    if: ${{ vars.DEPLOY_PLATFORM == '' || vars.DEPLOY_PLATFORM == 'github-pages' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Align npm with lockfile
        run: npm i -g npm@11.16.0

      - name: Install dependencies
        run: npm ci

      - name: Remove server-only routes for Pages build
        run: |
          rm -rf src/app/api
          rm -rf src/app/admin
          rm -rf "src/app/(public)/portfolio/[slug]"

      - name: Resolve public site URL
        id: site
        run: |
          OWNER="${{ github.repository_owner }}"
          REPO="${{ github.event.repository.name }}"
          if [ "$(echo "$REPO" | tr '[:upper:]' '[:lower:]')" = "$(echo "${OWNER}.github.io" | tr '[:upper:]' '[:lower:]')" ]; then
            echo "url=https://${OWNER}.github.io" >> "$GITHUB_OUTPUT"
          else
            echo "url=https://${OWNER}.github.io/${REPO}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build static export
        env:
          GITHUB_ACTIONS: "true"
          GITHUB_REPOSITORY: ${{ github.repository }}
          NEXT_PUBLIC_SITE_URL: ${{ steps.site.outputs.url }}
          NEXT_PUBLIC_STATIC_DEMO: "true"
        run: npm run build

      # GitHub Pages не применяет headers из next.config и не исполняет middleware — только CDN по умолчанию.
      # Для политики Cache-Control нужен self-host (`next start` / Docker) или прокси (Cloudflare) перед Pages.

      - name: Add .nojekyll
        run: touch out/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    if: ${{ vars.DEPLOY_PLATFORM == '' || vars.DEPLOY_PLATFORM == 'github-pages' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
