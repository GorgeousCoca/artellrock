# Публикация Docker-образа в GHCR; на сервере: docker pull && docker run.
# Settings → Variables: DEPLOY_PLATFORM = server
# Settings → Actions → General → Workflow permissions: «Read and write permissions»
#   (нужно для push в ghcr.io при использовании GITHUB_TOKEN)
#
# Секреты (опционально, для кастомного registry):
#   REGISTRY_USERNAME, REGISTRY_PASSWORD — если используете Docker Hub и т.п.
# По умолчанию: ghcr.io/${{ github.repository }}:main

name: Deploy server (Docker GHCR)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: server-docker-publish
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    if: ${{ vars.DEPLOY_PLATFORM == 'server' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Image reference (lowercase for GHCR)
        id: image
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=main
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
