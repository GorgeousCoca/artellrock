# GitLab CI — Node 22 (см. .nvmrc / package.json engines).
# Сайт работает на Next.js + Payload CMS (нужен Node-сервер и Postgres), статический экспорт
# (GitLab/GitHub/Cloudflare Pages) больше не поддерживается — деплой только через Docker-образ.
#
# Переменные CI/CD (Settings → CI/CD → Variables):
#   DEPLOY_PLATFORM — server (только main) — собрать и запушить Docker-образ в registry

default:
  image: node:22-bookworm
  interruptible: true

variables:
  NEXT_TELEMETRY_DISABLED: "1"
  # Заглушки для сборки: страницы dynamic, подключение к БД при `next build` не выполняется.
  PAYLOAD_SECRET: "ci-build-placeholder-secret-0123456789abcdef"
  DATABASE_URI: "postgres://ci:ci@localhost:5432/ci"

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

cache:
  key:
    files:
      - package-lock.json
  paths:
    - node_modules/

stages:
  - verify
  - deploy

.verify_before: &verify_before
  before_script:
    - npm ci

verify:
  stage: verify
  before_script: *verify_before
  script:
    - npm run lint
    - npm run typecheck
    - npm run test --if-present
    - npm run build

deploy-docker-registry:
  stage: deploy
  image: docker:27-cli
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    IMAGE_TAG: $CI_REGISTRY_IMAGE:main
  rules:
    - if: $CI_COMMIT_BRANCH == "main" && $DEPLOY_PLATFORM == "server"
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - docker build -t "$IMAGE_TAG" .
    - docker push "$IMAGE_TAG"
