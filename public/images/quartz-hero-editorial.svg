<svg width="1600" height="1000" viewBox="0 0 1600 1000" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="1000" gradientUnits="userSpaceOnUse">
      <stop stop-color="#EDE9E2"/>
      <stop offset="1" stop-color="#E5DED5"/>
    </linearGradient>
    <linearGradient id="slab" x1="900" y1="150" x2="1500" y2="850" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F5F2EE"/>
      <stop offset="0.6" stop-color="#EDE8E0"/>
      <stop offset="1" stop-color="#D8D0C4"/>
    </linearGradient>
    <linearGradient id="vein1" x1="950" y1="200" x2="1450" y2="780" gradientUnits="userSpaceOnUse">
      <stop stop-color="#C8BFB2" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#C8BFB2" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shadow" x1="800" y1="400" x2="1600" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1A1A1A" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#1A1A1A" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Cream background -->
  <rect width="1600" height="1000" rx="32" fill="url(#bg)"/>

  <!-- Subtle grid lines -->
  <line x1="400" y1="0" x2="400" y2="1000" stroke="#1A1A1A" stroke-opacity="0.04" stroke-width="1"/>
  <line x1="800" y1="0" x2="800" y2="1000" stroke="#1A1A1A" stroke-opacity="0.04" stroke-width="1"/>
  <line x1="1200" y1="0" x2="1200" y2="1000" stroke="#1A1A1A" stroke-opacity="0.04" stroke-width="1"/>
  <line x1="0" y1="333" x2="1600" y2="333" stroke="#1A1A1A" stroke-opacity="0.04" stroke-width="1"/>
  <line x1="0" y1="667" x2="1600" y2="667" stroke="#1A1A1A" stroke-opacity="0.04" stroke-width="1"/>

  <!-- Main quartz slab -->
  <rect x="880" y="120" width="620" height="760" rx="20" fill="url(#slab)"/>
  <rect x="880" y="120" width="620" height="760" rx="20" fill="url(#shadow)"/>

  <!-- Stone veins -->
  <path d="M920 180C980 240 1060 280 1120 340C1180 400 1200 460 1280 500C1340 530 1400 540 1460 580" stroke="url(#vein1)" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M940 320C1010 360 1080 400 1150 450C1220 500 1260 560 1330 610C1380 645 1430 660 1480 700" stroke="#C4BAB0" stroke-opacity="0.45" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <path d="M900 500C970 520 1040 545 1110 580C1180 615 1240 660 1320 690C1380 713 1440 720 1490 750" stroke="#BEB4AA" stroke-opacity="0.35" stroke-width="1" stroke-linecap="round" fill="none"/>
  <path d="M1000 160C1050 220 1090 290 1130 360C1160 420 1200 480 1240 550C1270 605 1310 660 1350 720C1390 775 1430 820 1480 860" stroke="#D4CCC4" stroke-opacity="0.3" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Slab border/shadow -->
  <rect x="880" y="120" width="620" height="760" rx="20" stroke="#1A1A1A" stroke-opacity="0.06" stroke-width="1" fill="none"/>

  <!-- Counter/tabletop shape -->
  <rect x="120" y="580" width="680" height="48" rx="8" fill="#5C5247" fill-opacity="0.12"/>
  <rect x="140" y="540" width="640" height="48" rx="8" fill="#5C5247" fill-opacity="0.09"/>
  <rect x="100" y="628" width="720" height="220" rx="0" fill="#5C5247" fill-opacity="0.05"/>

  <!-- Accent rectangles (material swatches) -->
  <rect x="120" y="200" width="180" height="120" rx="12" fill="#F0EBE3"/>
  <rect x="120" y="200" width="180" height="120" rx="12" stroke="#1A1A1A" stroke-opacity="0.08" stroke-width="1" fill="none"/>

  <rect x="316" y="200" width="180" height="120" rx="12" fill="#E8E0D4"/>
  <rect x="316" y="200" width="180" height="120" rx="12" stroke="#1A1A1A" stroke-opacity="0.08" stroke-width="1" fill="none"/>

  <rect x="512" y="200" width="180" height="120" rx="12" fill="#DDD5C8"/>
  <rect x="512" y="200" width="180" height="120" rx="12" stroke="#1A1A1A" stroke-opacity="0.08" stroke-width="1" fill="none"/>

  <!-- Label pills -->
  <rect x="144" y="232" width="72" height="20" rx="10" fill="#5C5247" fill-opacity="0.12"/>
  <rect x="340" y="232" width="60" height="20" rx="10" fill="#5C5247" fill-opacity="0.12"/>
  <rect x="536" y="232" width="68" height="20" rx="10" fill="#5C5247" fill-opacity="0.12"/>

  <!-- Small detail lines -->
  <line x1="144" y1="268" x2="280" y2="268" stroke="#1A1A1A" stroke-opacity="0.1" stroke-width="1"/>
  <line x1="144" y1="282" x2="248" y2="282" stroke="#1A1A1A" stroke-opacity="0.06" stroke-width="1"/>
  <line x1="340" y1="268" x2="476" y2="268" stroke="#1A1A1A" stroke-opacity="0.1" stroke-width="1"/>
  <line x1="536" y1="268" x2="672" y2="268" stroke="#1A1A1A" stroke-opacity="0.1" stroke-width="1"/>

  <!-- Accent dot -->
  <circle cx="200" cy="440" r="48" fill="#5C5247" fill-opacity="0.07"/>
  <circle cx="200" cy="440" r="32" fill="#5C5247" fill-opacity="0.08"/>
</svg>
